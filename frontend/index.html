<!DOCTYPE html>
<html lang="en" data-bs-theme="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <header>
    <nav class="navbar" id="nav">
      <div class="container-fluid">
        <a class="navbar-brand text-white">Expense Tracker</a>

        <button id="darkModeBtn" class="btn btn-dark" type="button">
          Dark Mode
        </button>
      </div>
    </nav>
  </header>

  <main>
    <div class="container ">
      <div class="row  ">
        <!-- Total Amount -->
        <div class="col-12 col-md-4 mt-3 ">
          <div class="card text-center  ">
            <div class="card-header">
              Total
            </div>
            <div class="card-body d-flex justify-content-center align-items-center">
              <p class="card-text fs-3 " id="totalNumber">$0</p>
            </div>

          </div>
        </div>
        <!-- Number of Expenses -->
        <div class="col-12 col-md-4 mt-3 ">
          <div class="card text-center ">
            <div class="card-header"> number of Expenses </div>
            <div class="card-body d-flex justify-content-center align-items-center">
              <p class="card-text fs-3 " id="expenseNumber">$0</p>
            </div>

          </div>
        </div>
        <!-- Highest Expense -->
        <div class="col-12 col-md-4 mt-3 ">
          <div class="card text-center ">
            <div class="card-header"> Highest Expense </div>
            <div class="card-body d-flex justify-content-center align-items-center">

              <p class="card-text fs-3 " id="highestExpense">$0</p>

            </div>
            <div class="card-footer text-body-secondary" id="nameOfExpense"> 2 days ago </div>
          </div>
        </div>

        <!-- Add Expense Form -->
        <div class="border  mt-3 mb-3 ">
          <div class="p-3">
            <h6> Add expense </h6>

            <form class="row " id="addExpenseForm">
              <div id="formAlert" class="alert alert-danger d-none col-12" role="alert"> Amount must be greater than 0.
              </div>

              <!-- Title -->
              <div class=" col-4 ">
                <label for="inputTitle"> Title </label>
                <input type="text" class="form-control" id="inputTitle" placeholder="Lunch">
              </div>

              <!-- Amount -->
              <div class=" col-2 ">
                <label for="inputAmount"> Amount </label>
                <input type="number" class="form-control " id="inputAmount" placeholder="9.99" step="0.01">
              </div>


              <!-- Category -->
              <div class=" col-3 ">
                <label for="inputCategory"> Category </label>
                <select class="form-select " id="inputCategory">
                  <option selected>Choose...</option>
                  <option>Food</option>
                  <option>Transport</option>
                  <option>Bills</option>
                  <option>Entertainment</option>
                  <option>Other</option>
                </select>
              </div>


              <!-- Date -->
              <div class=" col-3 ">
                <label for="inputDate"> Date </label>
                <input type="date" class="form-control" id="inputDate">
              </div>


              <!-- Button -->
              <div class=" mt-3 ">
                <button type="submit" class="btn btn-primary"> Add expense </button>
              </div>
            </form>
          </div>
        </div>


        <!-- Filter by Category -->
        <div class="border  mt-3 mb-3 ">
          <div class="p-3 d-flex justify-content-between align-items-center">
            <h5> Expenses </h5>

            <!-- csv button -->
            <button type="button" class="btn btn-success" id="exportCsvBtn"> Export CSV</button>

            <div class="   d-flex align-items-center">
              <label for="inputCategory" class="pe-2"> Category </label>

              <select class="form-select " id="filterCategory">
                <option selected>All Categories</option>
                <option>Food</option>
                <option>Transport</option>
                <option>Bills</option>
                <option>Entertainment</option>
                <option>Other</option>
              </select>
            </div>
          </div>

          <!-- spinner -->
          <div id="loadingSpinner" class="text-center d-none my-3">
            <div class="spinner-border text-primary" role="status">
              <span class="visually-hidden">Loading...</span>
            </div>
          </div>

          <!-- the table for displaying expenses -->
          <table class="table table-striped ">
            <thead>
              <tr>
                <th>Title</th>
                <th class="text-end">Amount</th>
                <th>Category</th>
                <th>Date</th>
                <th class="text-end">Actions</th>
              </tr>
            </thead>
            <tbody id="expensesTableBody">

              <!-- Table rows will generated here -->
            </tbody>

          </table>

          <!-- the chart -->
          <div class="border rounded p-3 mt-4 mb-3">
            <h6 class="mb-3">Expenses by Category</h6>
            <div style="max-width: 500px; height: 300px; margin: auto;">
              <canvas id="expenseChart"></canvas>
            </div>
          </div>


        </div>
      </div>
  </main>

  <footer></footer>

  <!-- for the edit  -->
  <div class="modal fade" id="editModal" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1"
    aria-labelledby="editModalLabel" aria-hidden="true">

    <div class="modal-dialog modal-dialog-centered">

      <div class="modal-content">

        <div class="modal-header">

          <h1 class="modal-title fs-5" id="editModalLabel"> Edit Expense </h1>

          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close">
          </button>

        </div>

        <div class="modal-body">

          <form id="editExpenseForm">
            <div id="editAlert" class="alert alert-danger d-none" role="alert"></div>

            <div class="mb-3">
              <label for="editTitle" class="form-label">  Title</label>
              <input type="text" class="form-control" id="editTitle">
            </div>

            <div class="mb-3">
              <label for="editAmount" class="form-label"> Amount </label>
              <input type="number" class="form-control" id="editAmount" step="0.01">
            </div>

            <div class="mb-3">
              <label for="editCategory" class="form-label"> Category</label>
              <select class="form-select" id="editCategory">
                <option>Food</option>
                <option>Transport</option>
                <option>Bills</option>
                <option>Entertainment</option>
                <option>Other</option>
              </select>
            </div>

            <div class="mb-3">
              <label for="editDate" class="form-label">Date</label>
              <input type="date" class="form-control" id="editDate">
            </div>


          </form>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal"> Close</button>
          <button type="submit" form="editExpenseForm" class="btn btn-primary">Update Expense</button>
        </div>

      </div>
    </div>
  </div>


  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <script src="js/api.js"></script>
<script src="js/validation.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>
</body>

</html>
